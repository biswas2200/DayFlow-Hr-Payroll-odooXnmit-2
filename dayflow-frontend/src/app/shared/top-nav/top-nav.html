<header class="top-nav">
  <a routerLink="/employees" class="brand">
    <img src="logo-icon.png" alt="" width="28" height="16" class="brand-mark" />
    <span class="brand-name">Dayflow</span>
  </a>

  <nav class="tabs-nav">
    <a routerLink="/employees" routerLinkActive="active">Employees</a>
    <a routerLink="/attendance" routerLinkActive="active">Attendance</a>
    <a routerLink="/time-off" routerLinkActive="active">Time Off</a>
    @if (isAdmin()) {
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
    }
  </nav>

  <div class="spacer"></div>

  <div class="systray">
    @if (!checkedIn()) {
      <button class="btn btn-primary btn-sm" [disabled]="busy()" (click)="checkIn()">
        <span class="systray-full">Check In →</span>
        <span class="systray-compact">In →</span>
      </button>
    } @else {
      <button class="btn btn-secondary btn-sm checked-in" [disabled]="busy()" (click)="checkOut()">
        <span class="pulse"></span>
        <span class="systray-full">Since {{ checkInTime() }} · {{ elapsed() }} · Check Out</span>
        <span class="systray-compact">{{ elapsed() }}</span>
      </button>
    }
  </div>

  <div class="notif-menu">
    <button class="icon-btn bell" title="Notifications" (click)="toggleNotif()">
      🔔
      @if (notificationService.unreadCount() > 0) {
        <span class="badge-count">{{ notificationService.unreadCount() }}</span>
      }
    </button>
    @if (notifOpen()) {
      <div class="dropdown notif-dropdown" (mouseleave)="notifOpen.set(false)">
        @for (n of notificationService.notifications(); track n.id) {
          <button
            type="button"
            class="notif-item"
            [class.unread]="!n.read"
            (click)="markNotifRead(n.id)"
          >
            <span class="notif-message">{{ n.message }}</span>
            <span class="notif-time">{{ n.createdAt | date: 'short' }}</span>
          </button>
        } @empty {
          <p class="notif-empty text-muted">No notifications yet.</p>
        }
      </div>
    }
  </div>

  <div class="avatar-menu">
    <button class="avatar" (click)="toggleMenu()" [class.checked-in-ring]="checkedIn()">
      {{ '👤' }}
    </button>
    @if (menuOpen()) {
      <div class="dropdown" (mouseleave)="menuOpen.set(false)">
        <a routerLink="/employees/me" (click)="menuOpen.set(false)">My Profile</a>
        <button (click)="logout()">Log Out</button>
      </div>
    }
  </div>
</header>
