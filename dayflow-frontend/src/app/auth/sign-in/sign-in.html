<div class="auth-screen">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <img class="logo" src="logo-full.png" alt="Dayflow" width="200" height="97" />
    <h2>Sign In</h2>

    <div class="field">
      <label for="loginId">Login ID / Email</label>
      <input id="loginId" type="text" formControlName="loginId" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing In…' : 'Sign In' }}
    </button>

    <p class="hint text-muted">
      No public sign-up — accounts are provisioned by your Admin/HR Officer.
    </p>
  </form>
</div>
