spring:
  application:
    name: hrmtool

  datasource:
    url: jdbc:postgresql://localhost:5432/dayflow_hrms
    username: dayflow
    password: dayflow123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:dayflow-hrms-very-long-secret-key-for-jwt-signing-minimum-256-bits-required-here}
    access-token-expiry-ms: 900000     # 15 minutes
    refresh-token-expiry-ms: 604800000 # 7 days

  upload:
    dir: ${UPLOAD_DIR:uploads}

  working-hours-per-day: 8
  default-working-days-per-week: 5

logging:
  level:
    com.dayflow.hrmtool: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
